# Runs every check on each push and pull request. All the steps live in
# scripts/check.sh, so running that script locally is running CI.
name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml, so the pinned toolchain installs itself.
      # The starter extension tests need jq 1.7 or later; ubuntu-latest has it.
      - run: jq --version
      - run: cargo install cargo-audit --locked
      - run: scripts/check.sh
