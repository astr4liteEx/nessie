[package]
name = "nessie"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Read Nessus scans and emit what is in them as JSON Lines records"
license = "MIT"
publish = false

[dependencies]
# Keep member order: records print in the order nessie builds them.
serde_json = { version = "1", features = ["preserve_order"] }
# 0.x: the API changes between minors, so pin exactly (ADR 0001).
quick-xml = "=0.42.0"

# Tests push tens of MB of JSON through serde_json: optimise dependencies
# even in dev builds (as rpt-tui does).
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
