[package]
name = "nessie"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Read Nessus scans and emit what is in them as JSON Lines records"
license = "MIT"
publish = false

[dependencies]
# Keep member order: records print in the order nessie builds them.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
strip = true
